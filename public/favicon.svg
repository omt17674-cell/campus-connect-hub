<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3C6E"/>
      <stop offset="100%" stop-color="#0E2342"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#E08B16"/>
    </linearGradient>
  </defs>
  <!-- Rounded Crest Background -->
  <rect width="64" height="64" rx="16" fill="url(#crestBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#F2A93B" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Graduation Cap & Academic Pillar -->
  <!-- Cap Diamond -->
  <polygon points="32,14 50,22 32,30 14,22" fill="url(#goldAccent)"/>
  <!-- Cap Base -->
  <path d="M22,26 L22,35 Q32,41 42,35 L42,26" fill="none" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel -->
  <path d="M47,23.5 L47,34" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="47" cy="35" r="1.5" fill="#FFFFFF"/>
  
  <!-- University Initials -->
  <text x="32" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">GSFC</text>
</svg>
